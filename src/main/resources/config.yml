  setblock-success: "&aBloco de ChunkLoader definido para o item da sua mão!"
  setitem-success: "&aItem ativador definido para o item da sua mão!"
  hold-item-error: "&cVocê precisa estar segurando um item na mão principal!"
  give-success: "&aVocê recebeu {amount}x {type}!"
  player-not-found: "&cJogador não encontrado."
  invalid-args: "&cUso incorreto! Digite /cl para ver a ajuda."
  loader-placed: "&aChunkLoader colocado com sucesso!"
  loader-removed: "&cChunkLoader removido com sucesso!"
  loader-activated: "&aChunkLoader ativado para o raio {radius}x{radius}!"
