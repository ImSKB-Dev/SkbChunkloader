# Bloco e Item Ativador Padrão
loader-block:
  material: "REDSTONE_BLOCK"
  damage: 0
  name: "&a&lChunkLoader Block"
  lore:
    - "&7Coloque este bloco no chão"
    - "&7e clique com o item ativador para configurá-lo."

activator-item:
  material: "NETHER_STAR"
  damage: 0
  name: "&e&lAtivador de ChunkLoader"
  lore:
    - "&7Clique com este item em um bloco de ChunkLoader"
    - "&7para abrir o menu de configurações."

# Configuração do GUI
gui:
  title: "&8ChunkLoader - Configurações"
  slots: 27

# Mensagens
messages:
  no-permission: "&cVocê não tem permissão para usar este comando."
